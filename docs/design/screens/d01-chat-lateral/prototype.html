function workspace(){document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===s.page));$('#pageTitle').textContent=s.page;$('#pageCrumb').textContent=s.page;$('#contextText').textContent='Em '+s.page;const shown=source.filter(r=>r.month==='Novembro');let h='';if(s.page==='Movimentações')h=`<section class="workspace-card"><strong>Movimentações recentes</strong>${shown.map(r=>`<div class="item"><span><strong>${esc(r.name)}</strong><small>${esc(r.date)} · ${s.applied&&selected().some(q=>q.id===r.id)?esc(s.name):esc(r.cat)}</small></span><strong class="negative">− ${fmt(r.value)}</strong></div>`).join('')}</section>`;else if(s.page==='Inteligência')h=`<section class="workspace-card"><strong>Suas decisões inteligentes</strong><div class="item"><span>Categoria ${esc(s.name)}</span><strong class="${s.applied?'positive':''}">${s.applied?'Criada':'Em preparação'}</strong></div><div class="item"><span>Regra para próximas compras</span><strong>${s.applied&&s.future?'Ativa':'Não ativa'}</strong></div></section>`;else h=`<section class="workspace-card"><strong>${esc(s.page)}</strong><p class="sub">O assistente mantém sua conversa durante a navegação.</p></section>`;$('#workspaceContent').innerHTML=h}
function record(r){const check=selected().some(q=>q.id===r.id);return `<div class="record ${check?'':'excluded'}"><input type="checkbox" aria-label="Incluir ${esc(r.name)} de ${esc(r.date)}" data-record="${r.id}" ${check?'checked':''}><div><strong>${esc(r.name)}</strong><small>${esc(r.date)} · ${esc(r.cat)} <span class="positive">→ ${esc(s.name)}</span></small></div><span class="amount negative">− ${fmt(r.value)}</span></div>`}
function proposal(){const m=matches();return `<div class="assistant-name"><span class="small-ai">✦</span> Assistente Financeiro</div><div class="assistant-intro"><p>Preparei a categoria e a regra para organizar suas assinaturas. Confira os lançamentos antes de decidir.</p></div><section class="proposal" aria-label="Proposta de categoria e regra"><div class="proposal-section"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="proposal-eyebrow">✦ Sua proposta está pronta</span><button class="inline-link" data-action="edit">✎ Personalizar</button></div><div class="category-head"><div class="category-icon" style="--category-color:${s.color}">▶</div><div class="category-info"><strong>${esc(s.name)}</strong><small>Nova categoria de despesas</small></div></div><p class="label">Compras identificadas por estas descrições:</p><div class="terms">${definitions.filter(t=>s.terms.includes(t.id)).map(t=>`<span class="term">${esc(t.pattern)}</span>`).join('')||'<small class="sub">Sem descrições selecionadas</small>'}</div></div><div class="proposal-section"><strong style="font-size:12px">O que vai mudar</strong><div class="impact"><div class="impact-box"><strong>${selected().length}</strong><small>Lançamentos</small></div><div class="impact-box"><strong>${fmt(value())}</strong><small>Valor reorganizado</small></div><div class="impact-box"><strong style="color:var(--warning)">${ambiguous().length}</strong><small>Para conferir</small></div></div><p class="impact-hint">Os gastos não mudam. Apenas as categorias dos lançamentos selecionados.</p></div><div class="proposal-section"><div class="section-heading"><strong>Movimentações afetadas</strong><button class="inline-link" data-action="all">${s.showAll?'Mostrar menos':`Ver todas (${m.length})`}</button></div>${s.retro?(m.length?(s.showAll?m:m.slice(0,3)).map(record).join(''):'<p class="sub">Nenhuma movimentação corresponde às descrições escolhidas.</p>'):'<p class="sub">Você optou por não modificar compras anteriores.</p>'}${ambiguous().length?`<div class="warn"><span class="warn-icon">◇</span><div><strong>1 compra ficará fora da regra</strong><p>Netflix Gift Card (${fmt(89.90)}) pode ser um presente, não uma assinatura.</p><button class="inline-link" data-action="why">${s.showWhy?'Ocultar motivo':'Entenda por que não foi incluída'} ${s.showWhy?'⌃':'⌄'}</button>${s.showWhy?'<p>Ela não corresponde à descrição exata NETFLIX.COM; fica preservada até revisão individual.</p>':''}</div></div>`:''}</div><div class="proposal-section"><div class="scope-row"><div><strong>Organizar compras anteriores</strong><small>Atualiza só os lançamentos selecionados.</small></div><button class="toggle" data-action="retro" role="switch" aria-label="Organizar compras anteriores" aria-checked="${s.retro}"><i></i></button></div><div class="scope-row"><div><strong>Categorizar próximas compras</strong><small>Aplica a regra a novas movimentações compatíveis.</small></div><button class="toggle" data-action="future" role="switch" aria-label="Categorizar próximas compras" aria-checked="${s.future}"><i></i></button></div></div><div class="proposal-section proposal-footer"><p>Você poderá revisar tudo novamente antes de confirmar.</p><button class="btn primary" data-action="confirm" ${(!s.future&&!selected().length)?'disabled':''}>Conferir e continuar <span>→</span></button></div></section>`}
function receipt(){return `<div class="assistant-name"><span class="small-ai">✦</span> Assistente Financeiro</div><div class="assistant-intro"><p>Pronto! As mudanças foram registradas nesta demonstração.</p></div><section class="receipt"><div class="receipt-icon">✓</div><h2>Categoria criada com sucesso.</h2><p><strong>${esc(s.name)}</strong>${s.future?' está pronta para organizar automaticamente novas assinaturas.':' foi criada sem regra futura ativa.'}</p><div class="receipt-grid"><div class="receipt-stat"><strong>1</strong><small>Categoria</small></div><div class="receipt-stat"><strong>${s.future?'Ativa':'—'}</strong><small>Regra futura</small></div><div class="receipt-stat"><strong>${selected().length}</strong><small>Reclassificadas</small></div></div><div class="item"><span class="sub">Valor reorganizado</span><strong>${fmt(value())}</strong></div><div class="item"><span class="sub">Compras duvidosas preservadas</span><strong>${ambiguous().length}</strong></div>${s.receiptOpen?selected().map(r=>`<div class="item"><span><strong>${esc(r.name)}</strong><small>${esc(r.cat)} → ${esc(s.name)} · ${esc(r.date)}</small></span><strong>${fmt(r.value)}</strong></div>`).join(''):''}<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px"><button class="btn" data-action="receipt">${s.receiptOpen?'Ocultar detalhes':'Ver alterações'}</button><button class="btn" data-action="undo">↶ Desfazer</button></div><p>Recibo demonstrativo. Nenhum dado pessoal ou regra real foi modificado.</p></section><div class="next"><p>Quer aproveitar a organização para tomar uma decisão?</p><button data-action="savings"><span>Quanto gasto com streaming e onde posso economizar?</span><span>↗</span></button></div>`}
function chat(){const h=`<div class="user-message">${esc(s.question)}</div>`+(s.applied?receipt():proposal())+(s.extra?`<div class="chat-extras"><h3>${s.extra==='savings'?'Seus gastos com streaming':'Sobre sua solicitação'}</h3><p>${s.extra==='savings'?`Neste exemplo, as assinaturas somam ${fmt(110.70)} em novembro. Comparar o uso dos serviços pode ajudar a encontrar uma redução sustentável. Uma economia só ocorre quando a cobrança é efetivamente cancelada.`:esc(s.extra)}</p></div>`:'');const node=$('#chat'),old=node.scrollTop;node.innerHTML=h;node.scrollTop=Math.min(old,node.scrollHeight)}
function menu(){const m=$('#menu');m.hidden=!s.menu;m.innerHTML=s.menu?'<strong style="font-size:12px;padding:4px 9px;display:block">Assistente Financeiro</strong><button data-action="theme">◐ Alternar tema</button><button data-action="new">＋ Nova conversa</button><button data-action="details">ⓘ Fonte e período</button>':''}
function modal(){const el=$('#modal');el.hidden=!s.modal;if(!s.modal){el.innerHTML='';return}if(s.modal==='edit'){const d=s.editDraft;el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal-kicker">Personalizar proposta</div><h2 id="editTitle">Deixe do seu jeito.</h2><p>Altere o nome, a cor ou os critérios. As movimentações afetadas serão recalculadas depois de salvar.</p><label for="editName">Nome da categoria</label><input type="text" id="editName" maxlength="28" value="${esc(d.name)}"><label>Cor</label><div class="colors">${['#53d896','#82aaf4','#d2a2ec','#f5bc63','#ff7a88'].map(c=>`<button type="button" class="swatch" style="background:${c}" aria-label="Selecionar cor ${c}" data-color="${c}" aria-pressed="${d.color===c}"></button>`).join('')}</div><label>Descrições a reconhecer</label>${definitions.map(t=>`<div class="term-row"><input type="checkbox" id="term_${t.id}" data-term="${t.id}" ${d.terms.includes(t.id)?'checked':''}><label for="term_${t.id}">${esc(t.pattern)}<small>Compras de ${esc(t.label)}</small></label></div>`).join('')}<div class="modal-actions"><button class="btn" data-action="cancel">Descartar edição</button><button class="btn primary" data-action="save">Atualizar proposta</button></div></div>`}else{el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="modal-kicker">Última confirmação</div><h2 id="confirmTitle">Podemos fazer essas mudanças?</h2><p>Confirme a operação completa. Nenhum lançamento duvidoso será incluído.</p><div class="summary-line"><i>◈</i><div><strong>Criar categoria ${esc(s.name)}</strong><small>Uma categoria de despesas com a cor escolhida.</small></div></div><div class="summary-line"><i>⌁</i><div><strong>${s.future?'Ativar categorização automática':'Sem regra automática futura'}</strong><small>${s.future?'Identificar '+definitions.filter(t=>s.terms.includes(t.id)).map(x=>x.label).join(', ')+'.':'Nenhuma compra futura será classificada automaticamente.'}</small></div></div><div class="summary-line"><i>▤</i><div><strong>Atualizar ${selected().length} movimentação(ões)</strong><small>${fmt(value())} serão reorganizados, sem modificar os valores pagos.</small></div></div>${ambiguous().length?'<div class="summary-line"><i style="color:var(--warning)">◇</i><div><strong>1 compra fica de fora</strong><small>Netflix Gift Card permanece na categoria original.</small></div></div>':''}<label class="consent"><input id="consent" type="checkbox" ${s.consent?'checked':''}><span>Conferi os lançamentos e autorizo criar esta categoria e aplicar somente as alterações descritas.</span></label><div class="modal-actions"><button class="btn" data-action="cancel">Voltar e revisar</button><button class="btn primary" data-action="apply" ${s.consent?'':'disabled'}>✓ Confirmar e criar</button></div></div>`}}
function render(){document.body.dataset.theme=s.theme;$('#drawer').classList.toggle('closed',!s.open);$('#drawer').classList.toggle('expanded',s.expanded);$('#backdrop').hidden=!s.open;$('#fab').hidden=s.open;workspace();chat();menu();modal()}
function act(a){if(a==='open')s.open=true;else if(a==='close')s.open=false;else if(a==='expand')s.expanded=!s.expanded;else if(a==='menu')s.menu=!s.menu;else if(a==='theme'){s.theme=s.theme==='dark'?'light':'dark';s.menu=false}else if(a==='details'){s.menu=false;toast('Fonte: dados fictícios · Período: outubro e novembro de 2026');return}else if(a==='new'){s=fresh()}else if(a==='all')s.showAll=!s.showAll;else if(a==='why')s.showWhy=!s.showWhy;else if(a==='retro'){s.retro=!s.retro;change()}else if(a==='future'){s.future=!s.future;change()}else if(a==='edit'){s.editDraft={name:s.name,color:s.color,terms:[...s.terms]};s.modal='edit';s.lastFocus=document.activeElement}else if(a==='save'){const d=s.editDraft;const name=$('#editName').value.trim();if(!name){toast('Informe o nome da categoria.');return}if(s.future&&!d.terms.length){toast('Escolha pelo menos uma descrição para a regra futura.');return}s.name=name;s.color=d.color;s.terms=d.terms;s.excluded=s.excluded.filter(id=>source.some(r=>r.id===id&&s.terms.includes(r.term)));s.editDraft=null;s.modal=null;change();toast('Proposta atualizada. Confira o impacto.')}
else if(a==='cancel'){s.modal=null;s.editDraft=null;s.consent=false}else if(a==='confirm'){if(!s.future&&!selected().length)return;s.consent=false;s.confirmedRevision=s.revision;s.modal='confirm';s.lastFocus=document.activeElement}else if(a==='apply'){if(!s.consent||s.confirmedRevision!==s.revision)return;s.applied=true;s.modal=null;s.extra='';s.receiptOpen=false;toast('Alterações confirmadas na demonstração.')}else if(a==='receipt')s.receiptOpen=!s.receiptOpen;else if(a==='undo'){s.applied=false;s.consent=false;s.confirmedRevision=null;s.extra='';s.receiptOpen=false;toast('Alterações demonstrativas desfeitas.')}else if(a==='savings')s.extra='savings';render();if(a==='apply'||a==='savings')$('#chat').scrollTop=$('#chat').scrollHeight}
 document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){s.page=page.dataset.page;render();return}const col=e.target.closest('[data-color]');if(col&&s.editDraft){s.editDraft.color=col.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.color===s.editDraft.color)));return}const b=e.target.closest('[data-action]');if(b){act(b.dataset.action);return}if(e.target.id==='modal'&&s.modal)act('cancel');else if(e.target.id==='backdrop')act('close')});
 document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-record]')){const id=el.dataset.record;if(el.checked)s.excluded=s.excluded.filter(x=>x!==id);else if(!s.excluded.includes(id))s.excluded.push(id);change();render()}else if(el.matches('[data-term]')&&s.editDraft){const id=el.dataset.term;if(el.checked&&!s.editDraft.terms.includes(id))s.editDraft.terms.push(id);else if(!el.checked)s.editDraft.terms=s.editDraft.terms.filter(x=>x!==id)}else if(el.id==='consent'){s.consent=el.checked;const btn=document.querySelector('[data-action=apply]');if(btn)btn.disabled=!s.consent}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){e.preventDefault();act('cancel');s.lastFocus?.focus?.()}else if(e.key==='Escape'&&s.menu){s.menu=false;render()}else if(e.target.id==='message'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#composer').requestSubmit()}});
 $('#composer').addEventListener('submit',e=>{e.preventDefault();const field=$('#message'),input=field.value.trim();field.value='';if(!input)return;if(/econom|assinatura|gasto|reduz/i.test(input))s.extra='savings';else if(/editar|personalizar|alterar nome/i.test(input)){act('edit');return}else if(/prévia|previa|movimenta|impacto/i.test(input)){s.showAll=true;s.extra=''}else if(/categoria|regra|criar/i.test(input)){s.question=input;s.applied=false;s.extra='';s.receiptOpen=false}else s.extra='Nesta prévia de design, experimente personalizar a categoria, revisar lançamentos e confirmar a regra. Conversas livres dependerão dos serviços reais.';render();$('#chat').scrollTop=$('#chat').scrollHeight});
 render();
})();
</script></body></html>
