# CircleCI | Meu Financeiro desktop Windows
# Só executa o job Windows quando a pipeline receber run_windows_build=true.
# Pushes e PRs normais usam o default false e não consomem créditos de runner.
version: 2.1

parameters:
  run_windows_build:
    type: boolean
    default: false

jobs:
  preflight_linux:
    docker:
      - image: node:22-bookworm
    steps:
      - checkout
      - run:
          name: "Preflight | TypeScript, SQLite, auditoria E1 e regressões IA"
          command: |
            export ELECTRON_SKIP_BINARY_DOWNLOAD=1
            npm install --no-audit --no-fund --package-lock=false
            npm run test:types
            npm run test:db
            npm run compile
            node scripts/renderer-provenance.cjs check-bundle
          no_output_timeout: 20m
      - run:
          name: "Preflight | Worker/PWA + bundle Cloudflare sem publicar"
          command: |
            cd mobile-push
            npm install --no-audit --no-fund --package-lock=false
            npm test
            npx wrangler deploy --dry-run --outdir /tmp/mf-e4-preview
          no_output_timeout: 20m
  build_windows:
    machine:
      image: "windows-server-2022-gui:current"
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: "Windows Server 2022 | Node 22 | testes e instaladores x64"
          command: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File .circleci/build-windows.ps1"
          no_output_timeout: 25m
      - store_artifacts:
          path: circleci-artifacts
          destination: MeuFinanceiro-Windows

workflows:
  windows_on_demand:
    when: << pipeline.parameters.run_windows_build >>
    jobs:
      - preflight_linux
      - build_windows:
          requires:
            - preflight_linux
