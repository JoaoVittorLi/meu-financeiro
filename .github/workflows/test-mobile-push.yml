name: Testar piloto de notificacoes
on:
  push:
    paths:
      - 'mobile-push/**'
      - '.github/workflows/test-mobile-push.yml'
  pull_request:
    paths:
      - 'mobile-push/**'
      - '.github/workflows/test-mobile-push.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras e sintaxe
        run: |
          node --check mobile-push/src/worker.js
          node --check mobile-push/public/app.js
          node --test mobile-push/test/*.test.js
