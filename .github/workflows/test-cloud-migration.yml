name: Validar preflight da migracao cloud
on:
  pull_request:
    paths:
      - 'electron/cloud-migration-audit.cjs'
      - 'electron/db.cjs'
      - 'electron/planning.cjs'
      - 'tests/cloud-migration-audit.test.cjs'
      - 'electron/cloud-migration-contract.cjs'
      - 'tests/cloud-migration-contract.test.cjs'
      - 'electron/cloud-migration-manifest.cjs'
      - 'tests/cloud-migration-manifest.test.cjs'
      - 'electron/recovery.cjs'
      - 'electron/main.cjs'
      - 'electron/preload.cjs'
      - 'src/app.ts'
      - '.github/workflows/test-cloud-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Testar schema de migracao e regressao SQLite
        run: npm run test:db
      - name: Verificar tipos da aplicacao
        run: npm run test:types
