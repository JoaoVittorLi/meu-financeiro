name: Compilar Meu Financeiro Electron (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Testar banco SQLite e compilar executáveis
        shell: pwsh
        run: npm run dist:windows
      - name: Conferir os dois EXEs e criar hashes SHA256
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path release -Filter '*.exe' -File)
          if ($executables.Count -ne 2) { throw "Esperados 2 EXEs (portátil e instalador); encontrados $($executables.Count)" }
          $executables | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path release/SHA256.txt -Encoding utf8
          Get-Content release/SHA256.txt
      - name: Disponibilizar executáveis
        uses: actions/upload-artifact@v4
        with:
          name: MeuFinanceiro-v0.6-Windows
          path: |
            release/*.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publicar pré-release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.6.0'
          $assets = @(Get-ChildItem release -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path release/SHA256.txt).Path
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --title 'Meu Financeiro v0.6.0 — Categorias e regras (prévia)' --notes 'Categorias personalizadas, regras automáticas por descrição, prioridades e correções por transação. Dashboard e orçamentos com opção de origem bancária ou manual, sem somar fontes. O extrato original permanece intacto e nenhuma credencial bancária é publicada. Faça um backup SQLite antes de atualizar.' --prerelease
          }
